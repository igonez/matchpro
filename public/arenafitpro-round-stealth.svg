<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#242429" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Bisel metálico circular de alta joalheria / titânio escovado -->
    <linearGradient id="metalBezel" x1="200" y1="100" x2="1848" y2="1948" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="20%" stop-color="#71717a" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#18181b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#71717a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Anel interno de detalhamento cirúrgico -->
    <linearGradient id="innerRing" x1="400" y1="200" x2="1648" y2="1848" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.05" />
    </linearGradient>

    <!-- Gradiente estelar com brilho tridimensional -->
    <linearGradient id="silverStar" x1="1024" y1="420" x2="1024" y2="1628" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f4f4f5" />
      <stop offset="65%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="420" y1="1024" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular OLED com Safe-Zone (100% livre de cortes do Instagram) -->
  <circle cx="1024" cy="1024" r="1020" fill="url(#bgGlow)" />
  
  <!-- Anel Bezel Metálico Circular Externo -->
  <circle cx="1024" cy="1024" r="1004" stroke="url(#metalBezel)" stroke-width="20" fill="none" />
  
  <!-- Anel Interno de Precisão -->
  <circle cx="1024" cy="1024" r="950" stroke="url(#innerRing)" stroke-width="4" stroke-dasharray="16 16" fill="none" />

  <!-- Emblema Geométrico Titanium ArenaFitPro (Escala ampliada perfeitamente segura dentro do círculo) -->
  <g filter="url(#glowFilter)">
    <!-- Polígono Estelar -->
    <path d="M1024 420 L1160 888 L1628 1024 L1160 1160 L1024 1628 L888 1160 L420 1024 L888 888 Z" fill="url(#silverStar)" />
    
    <!-- Faceta de Sombreamento 3D para volume angular -->
    <path d="M1024 420 L888 888 L420 1024 L888 1160 L1024 1628 Z" fill="url(#facetLeft)" />

    <!-- Núcleo de Contraste Angular -->
    <polygon points="1024,710 1120,1024 1024,1338 928,1024" fill="#000000" fill-opacity="0.45" />
    
    <!-- Anéis concêntricos do Núcleo -->
    <circle cx="1024" cy="1024" r="70" fill="#ffffff" filter="url(#coreGlow)" />
    <circle cx="1024" cy="1024" r="45" fill="#18181b" />
    <circle cx="1024" cy="1024" r="16" fill="#ffffff" />
  </g>
</svg>