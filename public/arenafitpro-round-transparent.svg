<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048" fill="none">
  <defs>
    <radialGradient id="bgGlowTrans" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#242429" />
      <stop offset="55%" stop-color="#111114" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="metalBezelTrans" x1="200" y1="100" x2="1848" y2="1948" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="20%" stop-color="#71717a" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#18181b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#71717a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="starTrans" x1="1024" y1="420" x2="1024" y2="1628" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f4f4f5" />
      <stop offset="65%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
    <filter id="glowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Círculo com corte perfeito e fundo transparente ao redor -->
  <circle cx="1024" cy="1024" r="1010" fill="url(#bgGlowTrans)" />
  <circle cx="1024" cy="1024" r="998" stroke="url(#metalBezelTrans)" stroke-width="20" fill="none" />

  <g filter="url(#glowTrans)">
    <path d="M1024 420 L1160 888 L1628 1024 L1160 1160 L1024 1628 L888 1160 L420 1024 L888 888 Z" fill="url(#starTrans)" />
    <polygon points="1024,710 1120,1024 1024,1338 928,1024" fill="#000000" fill-opacity="0.45" />
    <circle cx="1024" cy="1024" r="70" fill="#ffffff" />
    <circle cx="1024" cy="1024" r="45" fill="#18181b" />
    <circle cx="1024" cy="1024" r="16" fill="#ffffff" />
  </g>
</svg>