<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post · Compartilhar Ranking (Titanium) · ArenaFitPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  :root {
    --bg: #030303;
    --gold: #fbbf24;
    --titanium: #e4e4e7;
    --titanium-dim: #a1a1aa;
    --titanium-muted: #71717a;
    --font: "Plus Jakarta Sans", Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", monospace;
    --ts: 0 2px 14px rgba(0,0,0,.75), 0 1px 4px rgba(0,0,0,.85);
    --scale: 0.42;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000000; color: #e4e4e7; font-family: var(--font); }

  /* ---------- Painel de controle Titanium ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
    padding: 16px 24px; background: rgba(6,6,8,.88); backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .toolbar h1 {
    font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    margin: 0 16px 0 0; color: #fff; align-self: center; font-family: var(--mono);
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field span { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; }
  .field input[type=text] {
    height: 38px; min-width: 210px; padding: 0 12px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12); border-top-color: rgba(255,255,255,.24);
    background: rgba(14,14,18,.9); color: #fff; font: inherit; font-size: 13px;
  }
  .btn {
    height: 38px; padding: 0 16px; border-radius: 9999px;
    border: 1px solid rgba(255,255,255,.12); border-top-color: rgba(255,255,255,.26);
    background: rgba(20,20,24,.8); color: #fff; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.1);
  }
  .btn:hover { background: rgba(34,34,40,.95); border-color: rgba(255,255,255,.25); }
  .btn.primary {
    background: #ffffff; color: #000000; border: none; font-weight: 800;
    box-shadow: 0 10px 25px rgba(255,255,255,.18), inset 0 -2px 4px rgba(0,0,0,.3);
  }
  .btn.primary:hover { background: #f4f4f5; }
  .hint { font-size: 12px; color: #71717a; padding: 12px 24px 0; font-family: var(--mono); }

  /* ---------- Grade de slides ---------- */
  .grid { display: flex; flex-wrap: wrap; gap: 28px; padding: 24px; justify-content: center; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .frame {
    width: calc(1080px * var(--scale)); height: calc(1350px * var(--scale));
    overflow: hidden; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.1); border-top-color: rgba(255,255,255,.24);
    box-shadow: 0 25px 60px rgba(0,0,0,.85);
  }
  .scale { transform: scale(var(--scale)); transform-origin: top left; width: 1080px; height: 1350px; }
  .item-bar { display: flex; gap: 10px; align-items: center; font-size: 11px; font-family: var(--mono); color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }

  /* ---------- Slide (1080x1350 · 4:5 · OLED Titanium 3D) ---------- */
  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: #030303;
    font-family: var(--font); color: #fff;
  }
  .slide .photo-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(25%) contrast(1.06); }
  .slide .photo-ov {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(3,3,3,.84) 0%, rgba(3,3,3,.90) 52%, rgba(3,3,3,.98) 100%);
  }

  /* Grid 3D de Horizonte (Tron Floor Monocromático do ArenaFitPro) */
  .tron-grid {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
  }
  .titanium-orb {
    position: absolute; z-index: 1; pointer-events: none;
    width: 960px; height: 960px; border-radius: 9999px;
    background: radial-gradient(circle, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 42%, transparent 70%);
  }

  /* Pílula de topo estilo .mono-glass-pill */
  .kicker-pill {
    position: absolute; top: 82px; left: 88px; z-index: 3;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 22px; border-radius: 9999px;
    background: rgba(14,14,18,.85);
    border: 1px solid rgba(255,255,255,.14);
    border-top-color: rgba(255,255,255,.32);
    box-shadow: 0 12px 30px rgba(0,0,0,.8), inset 0 1px 1px rgba(255,255,255,.18);
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; color: #e4e4e7;
  }
  .kicker-pill .dot {
    width: 8px; height: 8px; border-radius: 999px; background: #ffffff;
    box-shadow: 0 0 10px rgba(255,255,255,.8);
  }

  .brandmark {
    position: absolute; top: 84px; right: 88px; z-index: 3;
    display: flex; align-items: center; gap: 12px; opacity: .8;
    font-family: var(--mono); font-size: 17px; font-weight: 800; letter-spacing: 2.5px; color: #e4e4e7;
  }
  .pager {
    position: absolute; bottom: 60px; right: 88px; z-index: 3;
    font-family: var(--mono); font-size: 16px; color: rgba(255,255,255,.45); font-weight: 700; letter-spacing: 2px;
  }

  /* Tipografia com gradiente metálico Titanium */
  .headline {
    position: absolute; left: 88px; right: 88px; top: 164px; z-index: 3;
    font-size: 82px; line-height: 1.04; font-weight: 800; letter-spacing: -2.4px; color: #ffffff;
  }
  .headline em {
    font-style: normal;
    background: linear-gradient(180deg, #ffffff 0%, #d4d4d8 55%, #71717a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    font-size: 30px; line-height: 1.38; font-weight: 500;
    color: #a1a1aa; letter-spacing: -0.3px; margin-top: 26px;
  }

  /* ---------- Mockup de celular em Titânio Escovado ---------- */
  .phone {
    position: absolute; z-index: 2; padding: 12px; border-radius: 58px;
    background: linear-gradient(145deg, #27272a 0%, #09090b 45%, #18181b 100%);
    border: 1.5px solid rgba(255,255,255,.22);
    box-shadow:
      0 40px 90px rgba(0,0,0,.85),
      0 0 0 1px rgba(0,0,0,.9),
      inset 0 1px 2px rgba(255,255,255,.28);
  }
  .screen { position: relative; overflow: hidden; border-radius: 46px; background: #050506; }
  .screen .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 34%; height: 30px; border-radius: 20px; background: #000; z-index: 5; border: 1px solid rgba(255,255,255,.06); }
  .screen .scaler { width: 1080px; height: 1920px; transform-origin: top left; }
  .checker {
    background-color: #0e0e11;
    background-image: linear-gradient(45deg,#18181d 25%,transparent 25%),linear-gradient(-45deg,#18181d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#18181d 75%),linear-gradient(-45deg,transparent 75%,#18181d 75%);
    background-size: 48px 48px; background-position: 0 0,0 24px,24px -24px,-24px 0;
  }

  /* ---------- Card do produto (1080x1920 · Fiel ao RankingShareCard do App com Dourado #fbbf24) ---------- */
  .card {
    width: 1080px; height: 1920px; position: relative; overflow: hidden; color: #fff;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 96px 104px 88px; font-family: var(--font);
  }
  .card.photo { background: linear-gradient(160deg, #18181b, #050506); }
  .card .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .card .ov { position: absolute; inset: 0; background: rgba(0,0,0,.30); z-index: 1; }
  .card .c { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
  .card .t { text-shadow: var(--ts); }
  .plogo {
    width: 60px; height: 60px; border-radius: 16px;
    border: 2px solid rgba(251,191,36,.65);
    background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: var(--gold);
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
    margin-bottom: 12px; overflow: hidden;
  }
  .plogo img { width: 100%; height: 100%; object-fit: cover; }
  .pbrand {
    font-size: 23px; font-weight: 700;
    color: var(--gold); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 6px;
  }
  .ctitle { font-size: 28px; font-weight: 600; color: rgba(255,255,255,.85); }
  .rk { font-size: 54px; font-weight: 800; line-height: 1.12; margin: 4px 0 44px; }
  .metrics { display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr; align-items: center; width: 100%; padding-bottom: 34px; }
  .metrics .m { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .metrics .v { font-size: 56px; font-weight: 800; line-height: 1.05; color: #ffffff; }
  .metrics .v.gold { color: var(--gold); }
  .metrics .l { font-size: 24px; font-weight: 500; color: rgba(255,255,255,.72); }
  .metrics .d { width: 1px; height: 64px; background: rgba(255,255,255,.28); }
  .gline {
    width: 100%; height: 2px;
    background: var(--gold);
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
    margin-bottom: 38px;
  }
  .list { width: 100%; display: flex; flex-direction: column; gap: 20px; text-align: left; }
  .list .lbl { font-size: 22px; font-weight: 700; letter-spacing: 3.5px; color: rgba(255,255,255,.75); margin-bottom: 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .row .n { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; color: #ffffff; }
  .row .dot { width: 10px; height: 10px; border-radius: 999px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .row.me .n { color: var(--gold); font-weight: 800; }
  .row.me .dot { background: var(--gold); }
  .row .p { font-size: 34px; font-weight: 800; color: var(--gold); }
  .giant { font-size: 230px; font-weight: 900; line-height: .92; letter-spacing: -4px; color: #ffffff; }
  .of { font-size: 38px; font-weight: 600; color: rgba(255,255,255,.82); margin-top: 14px; }
  .hline {
    width: 180px; height: 3px;
    background: var(--gold);
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
    margin: 36px 0 32px;
  }
  .xp { font-size: 52px; font-weight: 800; color: var(--gold); }
  .wm { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 64px; opacity: .55; font-size: 20px; font-weight: 700; letter-spacing: 2px; }

  /* ---------- Elementos de layout dos slides (Titanium Glass) ---------- */
  .caption { position: absolute; z-index: 3; text-align: center; font-size: 24px; font-weight: 700; color: #ffffff; }
  .caption small { display: block; font-family: var(--mono); font-size: 17px; font-weight: 500; color: #a1a1aa; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

  .glass-badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 24px; border-radius: 9999px;
    background: rgba(14,14,18,.85);
    border: 1px solid rgba(255,255,255,.14);
    border-top-color: rgba(255,255,255,.32);
    box-shadow: 0 14px 30px rgba(0,0,0,.75), inset 0 1px 1px rgba(255,255,255,.16);
    font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: 1px;
  }

  .sheet {
    position: absolute; z-index: 2; border-radius: 28px;
    background: rgba(10,10,12,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-top-color: rgba(255,255,255,.18);
    box-shadow: 0 25px 60px rgba(0,0,0,.85), inset 0 1px 1px rgba(255,255,255,.08);
    padding: 36px 34px; display: flex; flex-direction: column; gap: 22px;
  }
  .sheet .r { height: 22px; border-radius: 6px; background: #1f1f24; }
  .sheet .r.h { background: #2e2e36; height: 26px; }

  .tri {
    position: absolute; z-index: 3; left: 88px; right: 88px;
    display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr; align-items: center;
    padding: 26px 20px; border-radius: 28px;
    background: rgba(10,10,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-top-color: rgba(255,255,255,.24);
    box-shadow: 0 25px 60px rgba(0,0,0,.85), inset 0 1px 1px rgba(255,255,255,.12);
  }
  .tri .m { text-align: center; }
  .tri .v { font-size: 32px; font-weight: 800; color: #ffffff; }
  .tri .l { font-family: var(--mono); font-size: 17px; color: #a1a1aa; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .tri .d { width: 1px; height: 64px; background: rgba(255,255,255,.14); }

  .panel {
    position: absolute; z-index: 2; overflow: hidden; border-radius: 36px;
    border: 1px solid rgba(255,255,255,.12);
    border-top-color: rgba(255,255,255,.30);
    box-shadow: 0 30px 70px rgba(0,0,0,.9), inset 0 1px 1px rgba(255,255,255,.18);
  }
  .panel .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .note {
    position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 20px; border-radius: 9999px;
    background: rgba(10,10,12,.82); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.14); border-top-color: rgba(255,255,255,.3);
    font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;
  }
  .note i { display: block; width: 8px; height: 8px; border-radius: 999px; background: #ffffff; box-shadow: 0 0 8px #fff; }

  .actions { position: absolute; z-index: 3; left: 88px; right: 88px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .act {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 34px 16px; border-radius: 32px;
    background: rgba(10,10,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-top-color: rgba(255,255,255,.24);
    box-shadow: 0 25px 60px rgba(0,0,0,.85), inset 0 1px 1px rgba(255,255,255,.12);
    font-size: 26px; font-weight: 700; color: #e4e4e7;
  }
  .act .ic {
    width: 112px; height: 112px; border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-top-color: rgba(255,255,255,.32);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.15);
  }
  .act .ic.ig {
    background: linear-gradient(45deg, #f59e0b, #ec4899, #9333ea); color: #ffffff; border: none;
    box-shadow: 0 10px 28px rgba(236,72,153,.28);
  }
  .act svg { width: 48px; height: 48px; }

  /* Card "Seu Desempenho" fiel ao /app/leaderboard do aplicativo */
  .app-rank-card {
    position: absolute; left: 88px; right: 88px; z-index: 3;
    padding: 30px 34px; border-radius: 34px;
    border: 1.5px solid rgba(251,191,36,.32);
    background: linear-gradient(135deg, rgba(245,158,11,.10) 0%, rgba(9,9,11,.96) 48%, rgba(9,9,11,.98) 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.85), inset 0 1px 1px rgba(251,191,36,.18);
  }
  .app-rank-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .app-rank-badge {
    width: 86px; height: 86px; border-radius: 24px;
    background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 50%, #d97706 100%);
    color: #000; font-family: var(--mono); display: flex; flex-direction: column;
    align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 28px rgba(251,191,36,.35);
  }
  .app-rank-badge small { font-size: 13px; font-weight: 800; opacity: .78; letter-spacing: 1px; }
  .app-rank-badge strong { font-size: 30px; font-weight: 900; line-height: 1.05; }
  .app-rank-pill {
    font-family: var(--mono); font-size: 14px; font-weight: 700;
    padding: 5px 12px; border-radius: 8px;
    background: rgba(251,191,36,.18); color: #fcd34d;
    border: 1px solid rgba(251,191,36,.35);
  }
  .app-rank-btn {
    width: 100%; height: 64px; border-radius: 20px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: var(--mono); font-size: 21px; font-weight: 700; color: #ffffff;
  }

  /* Botão Metálico Monocromático (.mono-button-primary) */
  .cta {
    position: absolute; z-index: 3; left: 88px; display: inline-flex; align-items: center; gap: 18px;
    height: 104px; padding: 0 52px; border-radius: 9999px;
    background: #ffffff; color: #000000;
    font-size: 34px; font-weight: 800; letter-spacing: -0.5px;
    box-shadow: 0 14px 36px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.3);
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>ArenaFitPro · Titanium Post Studio</h1>
  <label class="field"><span>Marca do Personal (Topo)</span><input id="brand" type="text" value="Team Silva" maxlength="32" /></label>
  <label class="field"><span>Nome do Desafio</span><input id="challenge" type="text" value="Desafio 30 Dias Shape" maxlength="38" /></label>
  <button class="btn" id="btnLogo">Logo do Personal</button>
  <button class="btn" id="btnPhoto">Trocar Foto de Fundo</button>
  <input id="fileLogo" type="file" accept="image/*" hidden />
  <input id="filePhoto" type="file" accept="image/*" hidden />
  <span style="flex:1"></span>
  <button class="btn primary" id="btnAll">Baixar os 5 PNGs</button>
</div>
<p class="hint">DESIGN SYSTEM: TITANIUM MONOCHROME 3D · 1080×1350 (4:5 FEED INSTAGRAM)</p>

<div class="grid" id="grid"></div>

<script>
(() => {
  const DEFAULT_PHOTO = 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=80';
  const state = { brand: 'Team Silva', challenge: 'Desafio 30 Dias Shape', logo: null, photo: DEFAULT_PHOTO };

  const STANDINGS = [
    { name: 'Ana C.', pts: 1280 },
    { name: 'Bruno M.', pts: 1195 },
    { name: 'Carla S.', pts: 1110, me: true },
    { name: 'Diego R.', pts: 1040 },
    { name: 'Elisa P.', pts: 985 },
  ];
  const TOTAL = 42, MY_RANK = 3, MY_PTS = 1110;

  let uid = 0;
  const afpLogo = (size) => {
    const i = ++uid;
    return `<svg width="${size}" height="${size}" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g${i}" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#27272a"/><stop offset="100%" stop-color="#000"/></radialGradient>
        <linearGradient id="s${i}" x1="256" y1="120" x2="256" y2="392" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e4e4e7"/><stop offset="100%" stop-color="#71717a"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="128" fill="url(#g${i})"/>
      <rect width="508" height="508" x="2" y="2" rx="126" stroke="rgba(255,255,255,.22)" stroke-width="4"/>
      <path d="M256 88 L296 216 L424 256 L296 296 L256 424 L216 296 L88 256 L216 216 Z" fill="url(#s${i})"/>
      <polygon points="256,170 282,256 256,342 230,256" fill="#000" fill-opacity=".4"/>
      <circle cx="256" cy="256" r="16" fill="#fff"/>
    </svg>`;
  };

  // Grid 3D em perspectiva (Tron Floor Monocromático idêntico ao Monochrome3DBackground)
  const tronBackdrop = () => {
    const lines = [];
    const vx = 540, vy = 680, h = 1350, w = 1080;
    for (let i = 0; i <= 22; i++) {
      const bx = (w / 22) * i * 1.6 - w * 0.3;
      lines.push(`<line x1="${vx}" y1="${vy}" x2="${bx}" y2="${h + 80}" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>`);
    }
    for (let i = 1; i <= 14; i++) {
      const f = Math.pow(i / 14, 2.3);
      const y = vy + f * (h - vy + 80);
      const a = (f * 0.08).toFixed(3);
      lines.push(`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(255,255,255,${a})" stroke-width="1"/>`);
    }
    return `
      <div class="titanium-orb" style="left:60px;top:-180px"></div>
      <svg class="tron-grid" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">${lines.join('')}</svg>
    `;
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const initials = (s) => {
    const p = s.trim().split(/\s+/).filter(Boolean);
    if (!p.length) return 'P';
    return p.length === 1 ? p[0].slice(0, 2).toUpperCase() : (p[0][0] + p[p.length - 1][0]).toUpperCase();
  };
  const img = (src, cls) => `<img class="${cls}" src="${src}" alt="" crossorigin="anonymous" onerror="this.style.display='none'" />`;

  const personalHeader = () => `
    <div class="plogo">${state.logo ? `<img src="${state.logo}" alt="" />` : initials(state.brand || state.challenge)}</div>
    ${state.brand.trim() ? `<div class="pbrand t">${esc(state.brand.trim())}</div>` : ''}`;

  const card = (variant, withPhoto) => {
    const bg = withPhoto ? `${img(state.photo, 'bg')}<div class="ov"></div>` : '';
    const body = variant === 'list' ? `
      ${personalHeader()}
      <div class="ctitle t">${esc(state.challenge)}</div>
      <div class="rk t">Ranking</div>
      <div class="metrics">
        <div class="m"><span class="v t">${MY_RANK}º</span><span class="l t">posição</span></div><div class="d"></div>
        <div class="m"><span class="v gold t">${MY_PTS}</span><span class="l t">pontos</span></div><div class="d"></div>
        <div class="m"><span class="v t">de ${TOTAL}</span><span class="l t">atletas</span></div>
      </div>
      <div class="gline"></div>
      <div class="list">
        <div class="lbl t">CLASSIFICAÇÃO</div>
        ${STANDINGS.map((s) => `<div class="row${s.me ? ' me' : ''}"><span class="n t"><span class="dot"></span>${s.name}</span><span class="p t">${s.pts} XP</span></div>`).join('')}
      </div>` : `
      ${personalHeader()}
      <div class="ctitle t" style="font-size:30px;margin-bottom:18px">${esc(state.challenge)}</div>
      <div class="giant t">${MY_RANK}º</div>
      <div class="of t">de ${TOTAL} atletas</div>
      <div class="hline"></div>
      <div class="xp t">${MY_PTS} XP</div>`;
    return `<div class="card${withPhoto ? ' photo' : ''}">${bg}
      <div class="c" style="padding-bottom:${variant === 'hero' ? 28 : 0}px">${body}</div>
      <div class="wm t">${afpLogo(32)}<span>ARENAFITPRO</span></div>
    </div>`;
  };

  const phone = (inner, { x, y, w, rotate = 0, checker = false }) => {
    const h = Math.round(w * 16 / 9);
    return `<div class="phone" style="left:${x}px;top:${y}px;transform:rotate(${rotate}deg)">
      <div class="screen${checker ? ' checker' : ''}" style="width:${w}px;height:${h}px">
        <div class="notch"></div>
        <div class="scaler" style="transform:scale(${w / 1080})">${inner}</div>
      </div>
    </div>`;
  };

  const chrome = (n, kicker) => `
    <div class="kicker-pill"><span class="dot"></span><span>${kicker}</span></div>
    <div class="brandmark">${afpLogo(36)}<span>ARENAFITPRO</span></div>
    <div class="pager">0${n} / 05</div>`;

  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>',
    share: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
  };

  const slides = [
    // 1 · Capa
    () => `
      ${img(state.photo, 'photo-bg')}<div class="photo-ov"></div>
      ${tronBackdrop()}
      ${chrome(1, 'Nova Função')}
      <div class="headline">Seus alunos agora divulgam a <em>sua consultoria</em> nos Stories.
        <div class="sub">Chegou o Compartilhamento de Ranking 9:16 — com a sua marca no topo de cada card.</div>
      </div>
      ${phone(card('list', true), { x: 150, y: 690, w: 340, rotate: -7 })}
      ${phone(card('hero', true), { x: 566, y: 650, w: 340, rotate: 6 })}`,

    // 2 · A dor
    () => `
      ${tronBackdrop()}
      ${chrome(2, 'O Problema')}
      <div class="headline">Print de tabela <em>não viraliza</em>.
        <div class="sub">Foto pós-treino mostrando o Top 3? Essa todo mundo posta.</div>
      </div>
      <div class="sheet" style="left:110px;top:540px;width:380px;height:560px;opacity:.75">
        <div class="r h" style="width:70%"></div>
        ${Array.from({ length: 11 }, (_, i) => `<div style="display:flex;gap:14px"><div class="r" style="flex:1"></div><div class="r" style="width:${60 + (i % 3) * 14}px"></div></div>`).join('')}
      </div>
      <div class="caption" style="left:110px;top:1145px;width:380px">
        <span class="glass-badge" style="color:#71717a;border-color:rgba(255,255,255,.08)">✕ NINGUÉM POSTA ISSO</span>
      </div>
      ${phone(card('list', true), { x: 586, y: 490, w: 340 })}
      <div class="caption" style="left:586px;top:1145px;width:364px">
        <span class="glass-badge" style="color:#ffffff">✓ TODO MUNDO POSTA ISSO</span>
      </div>`,

    // 3 · A solução
    () => `
      ${tronBackdrop()}
      ${chrome(3, 'A Solução')}
      <div class="headline" style="font-size:80px">2 cards. 3 fundos.<br/><em>1 toque.</em></div>
      ${phone(card('list', true), { x: 150, y: 410, w: 320 })}
      ${phone(card('hero', false), { x: 610, y: 410, w: 320, checker: true })}
      <div class="caption" style="left:150px;top:1025px;width:344px">Classificação<small>Top 5 + métricas</small></div>
      <div class="caption" style="left:610px;top:1025px;width:344px">Posição Gigante<small>Sticker Transparente</small></div>
      <div class="tri" style="top:1140px">
        <div class="m"><div class="v">Câmera</div><div class="l">foto na hora</div></div><div class="d"></div>
        <div class="m"><div class="v">Galeria</div><div class="l">sua melhor foto</div></div><div class="d"></div>
        <div class="m"><div class="v">Transparente</div><div class="l">sticker PNG no Story</div></div>
      </div>`,

    // 4 · Diferencial: marca do personal
    () => `
      ${tronBackdrop()}
      ${chrome(4, 'White-Label')}
      <div class="headline">Sua marca em <em>primeiro lugar</em>.</div>
      <div class="panel" style="left:88px;top:360px;width:904px;height:760px">
        ${img(state.photo, 'photo-bg')}<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,3,3,.55),rgba(3,3,3,.82))"></div>
        <div class="inner" style="padding-top:115px">
          <div style="transform:scale(2);transform-origin:top center;display:flex;flex-direction:column;align-items:center;font-family:var(--font)">
            ${personalHeader()}
            <div class="ctitle t">${esc(state.challenge)}</div>
            <div class="rk t" style="margin-bottom:0">Ranking</div>
          </div>
          <div style="flex:1"></div>
          <div class="wm t" style="margin:0 0 56px">${afpLogo(32)}<span>ARENAFITPRO</span></div>
        </div>
        <div class="note" style="left:36px;top:36px"><i style="background:var(--gold);box-shadow:0 0 10px var(--gold)"></i>Topo · Seu Logo + Nome</div>
        <div class="note" style="left:36px;bottom:118px;color:#a1a1aa"><i style="background:#71717a;box-shadow:none"></i>Rodapé · Marca d'água discreta</div>
      </div>
      <div class="sub" style="position:absolute;left:88px;right:88px;top:1155px;z-index:3">Cada Story dos seus alunos vira prova social orgânica para a sua <span style="color:#fff;font-weight:700">próxima turma</span>.</div>`,

    // 5 · CTA
    () => `
      ${tronBackdrop()}
      ${chrome(5, 'Já Disponível')}
      <div class="headline" style="font-size:74px">Abra o ranking.<br/>Toque em compartilhar.<br/><em>Pronto.</em></div>
      <div class="app-rank-card" style="top:495px">
        <div class="app-rank-top">
          <div style="display:flex;align-items:center;gap:20px">
            <div class="app-rank-badge"><small>RANK</small><strong>#0${MY_RANK}</strong></div>
            <div>
              <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:24px;font-weight:900;letter-spacing:.5px;text-transform:uppercase">Seu Desempenho</span>
                <span class="app-rank-pill">ZONA DE PÓDIO</span>
              </div>
              <div style="font-family:var(--mono);font-size:19px;color:#d4d4d8;margin-top:8px">Faltam <strong style="color:#fcd34d">85 XP</strong> para ultrapassar <strong style="color:#fff">#2 Bruno</strong></div>
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-family:var(--mono);font-size:40px;font-weight:900;line-height:1">${MY_PTS}</div>
            <div style="font-family:var(--mono);font-size:15px;font-weight:800;color:var(--gold);letter-spacing:1.5px;margin-top:6px">XP TOTAL</div>
          </div>
        </div>
        <div class="app-rank-btn">${ICONS.share}<span>Compartilhar Pódio & Ranking (Stories / WhatsApp)</span></div>
      </div>
      <div class="actions" style="top:805px">
        <div class="act" style="padding:24px 14px"><div class="ic" style="width:92px;height:92px">${ICONS.copy}</div>Copiar</div>
        <div class="act" style="padding:24px 14px"><div class="ic" style="width:92px;height:92px">${ICONS.save}</div>Salvar</div>
        <div class="act" style="padding:24px 14px"><div class="ic ig" style="width:92px;height:92px">${ICONS.ig}</div>Story</div>
        <div class="act" style="padding:24px 14px"><div class="ic" style="width:92px;height:92px">${ICONS.more}</div>Mais</div>
      </div>
      <div class="cta" style="top:1105px">Teste no ArenaFitPro <span>→</span></div>
      <div style="position:absolute;left:96px;top:1236px;z-index:3;font-family:var(--mono);font-size:18px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45)">LINK NA BIO · ARENAFITPRO.COM.BR</div>`,
  ];

  const grid = document.getElementById('grid');
  const NAMES = ['01-capa', '02-problema', '03-solucao', '04-marca-personal', '05-cta'];

  function render() {
    uid = 0;
    grid.innerHTML = slides.map((fn, i) => `
      <div class="item">
        <div class="frame"><div class="scale"><div class="slide" id="slide-${i}">${fn()}</div></div></div>
        <div class="item-bar"><span>SLIDE 0${i + 1}</span><button class="btn" data-dl="${i}">Baixar PNG</button></div>
      </div>`).join('');
  }

  async function waitImages(node) {
    await Promise.all([...node.querySelectorAll('img')].map((im) =>
      im.complete ? (im.decode ? im.decode().catch(() => {}) : 0) : new Promise((r) => { im.onload = im.onerror = r; })
    ));
  }

  async function exportSlide(i) {
    const node = document.getElementById(`slide-${i}`);
    await document.fonts.ready;
    await waitImages(node);
    const opts = { width: 1080, height: 1350, pixelRatio: 1, cacheBust: false };
    let url;
    try { url = await htmlToImage.toPng(node, opts); }
    catch (e) { console.warn('Retentando sem embutir fontes', e); url = await htmlToImage.toPng(node, { ...opts, skipFonts: true }); }
    const a = document.createElement('a');
    a.href = url; a.download = `arenafitpro-compartilhar-ranking-${NAMES[i]}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  grid.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-dl]');
    if (!b) return;
    const t = b.textContent; b.textContent = 'Gerando…'; b.disabled = true;
    try { await exportSlide(+b.dataset.dl); } catch (err) { alert('Falha ao gerar PNG: ' + err.message + '\nDica: use print da tela como alternativa.'); }
    b.textContent = t; b.disabled = false;
  });

  document.getElementById('btnAll').addEventListener('click', async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Gerando…';
    try { for (let i = 0; i < slides.length; i++) await exportSlide(i); }
    catch (err) { alert('Falha ao gerar PNG: ' + err.message); }
    b.disabled = false; b.textContent = 'Baixar os 5 PNGs';
  });

  const readFile = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const bindUpload = (btnId, inputId, key) => {
    const input = document.getElementById(inputId);
    document.getElementById(btnId).onclick = () => input.click();
    input.onchange = async () => { if (input.files[0]) { state[key] = await readFile(input.files[0]); render(); } };
  };
  bindUpload('btnLogo', 'fileLogo', 'logo');
  bindUpload('btnPhoto', 'filePhoto', 'photo');

  document.getElementById('brand').oninput = (e) => { state.brand = e.target.value; render(); };
  document.getElementById('challenge').oninput = (e) => { state.challenge = e.target.value || 'Desafio Oficial'; render(); };

  render();
})();
</script>
</body>
</html>
