<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="metalBezel" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="silverStar" x1="256" y1="120" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <filter id="glowFilter" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo OLED com Borda Especular -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="url(#metalBezel)" stroke-width="4" />

  <!-- Emblema Geométrico Titanium ArenaFitPro -->
  <g filter="url(#glowFilter)">
    <!-- Polígono Estelar / Foco Central -->
    <path d="M256 88 L296 216 L424 256 L296 296 L256 424 L216 296 L88 256 L216 216 Z" fill="url(#silverStar)" />
    <!-- Núcleo de Contraste -->
    <polygon points="256,170 282,256 256,342 230,256" fill="#000000" fill-opacity="0.4" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
